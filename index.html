<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snorkelling Conditions Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            color: #333;
            background-color: #f0f8ff;
            padding: 20px;
        }
        h1, h3 {
            color: #0077be;
        }
        #weatherData, #tideData, #videoStreamContainer {
            background-color: #e0efff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        a {
            color: #0077be;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        #videoStream {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }
        #videoStreamContainer {
            width: 100%;
            max-width: 830px;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Flinders Snorkelling Conditions Dashboard</h1>
    
    <h3>Weather</h3>
    <div id="weatherData">
        <p>Air Temperature: <span id="airTemp"></span>°C</p>
        <p>Wind Speed: <span id="windSpeed"></span> kt, Direction: <span id="windDir"></span></p>
        <p>Gust: <span id="gust"></span> kt</p>
        <p>Rainfall: <span id="rainfall"></span> mm</p>
    </div>

    <a href="https://tidecam.dunc.app/flinders.m3u8">
        <h3>Flinders Surf Cam</h3>
    </a>
    <div id="videoStreamContainer">
        <video id="videoStream" controls autoplay muted></video>
    </div>

    <h3>Tide Times for Flinders</h3>
    <div id="tideData">
        <p>Loading tide data...</p>
    </div>
    <div>
        <a href="https://www.bom.gov.au/ntc/IDO59001/IDO59001_2026_VIC_TP013.pdf" 
       target="_blank" 
       style="display: inline-block; padding: 10px 20px; background-color: #0077be; color: #ffffff; border-radius: 5px; text-decoration: none; font-weight: bold; margin-bottom: 20px;">
       View Full 2026 Tide Tables (PDF)
        </a>
    </div>
    <script>
        // Production base URL
        const API_BASE = "https://tidecam.dunc.app";

        document.addEventListener('DOMContentLoaded', function() {
            fetchWeatherData();
            initVideoStream();
            fetchTideData();
        });

        function fetchWeatherData() {
            const timeStamp = new Date().getTime();
            fetch(`${API_BASE}/bom/IDV60701/IDV60701.94898.json?t=${timeStamp}`)
                .then(response => response.json())
                .then(data => {
                    const obs = data.observations.data[0];
                    document.getElementById('airTemp').textContent = obs.air_temp;
                    document.getElementById('windSpeed').textContent = obs.wind_spd_kt;
                    document.getElementById('windDir').textContent = obs.wind_dir;
                    document.getElementById('gust').textContent = obs.gust_kt;
                    document.getElementById('rainfall').textContent = obs.rain_trace;
                })
                .catch(error => console.error('Error fetching weather data:', error));
        }

        function initVideoStream() {
            var video = document.getElementById('videoStream');
            const videoUrl = `${API_BASE}/au-bigleft.m3u8`;

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        function fetchTideData() {
            fetch(`${API_BASE}/tides/VIC_TP013`)
                .then(response => response.json())
                .then(data => {
                    displayTideData(data.results);
                })
                .catch(error => {
                    console.error('Error fetching tide data:', error);
                    document.getElementById('tideData').innerHTML = '<p>Error loading tide data.</p>';
                });
        }

        function displayTideData(results) {
            const formatTime = (unixTime) => {
                return new Date(unixTime * 1000).toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const high = results.next_high;
            const low = results.next_low;

            const tideInfo = `
                <p><strong>Next High Tide:</strong> ${formatTime(high.time)} (${high.height}m)</p>
                <p><strong>Next Low Tide:</strong> ${formatTime(low.time)} (${low.height}m)</p>
            `;

            document.getElementById('tideData').innerHTML = tideInfo;
        }
    </script>
</body>
</html>
